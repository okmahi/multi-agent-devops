apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  namespace: devops-ai

spec:
  replicas: 1

  selector:
    matchLabels:
      app: payment-service

  template:
    metadata:
      labels:
        app: payment-service

    spec:
      containers:
      - name: payment-service
        image: payment-service:v2

        imagePullPolicy: Never

        ports:
        - containerPort: 8000