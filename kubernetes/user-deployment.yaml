apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: devops-ai

spec:
  replicas: 1

  selector:
    matchLabels:
      app: user-service

  template:
    metadata:
      labels:
        app: user-service

    spec:
      containers:
      - name: user-service
        image: user-service:v4
        
        imagePullPolicy: Never

        ports:
        - containerPort: 8000